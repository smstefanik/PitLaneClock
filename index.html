<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pit Lane Clock — Prototype</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 20px; }
    svg { width: min(70vh, 85vw, 760px); height: auto; overflow: visible; }
    .hand { transform-origin: 300px 300px; }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 680px; }
    button { background: #171717; color: #ffffff; border: 1px solid #383838; border-radius: 7px; padding: 10px 15px; font: inherit; cursor: pointer; }
    button:hover { background: #292929; }
    button[aria-pressed="true"] { background: #ffffff; color: #111; border-color: #ffffff; }
    button:focus-visible { outline: 2px solid #ff3a3a; outline-offset: 3px; }
    output { font: 14px ui-monospace, monospace; color: #999; text-align: center; min-height: 20px; }
    .hint { color: #555; font-size: 12px; margin: 0; }
  </style>
</head>
<body>
<main>
  <svg viewBox="0 0 600 600" role="img" aria-label="Analog clock">
    <defs>
      <filter id="hand-shadow" filterUnits="userSpaceOnUse" x="65" y="65" width="470" height="470" color-interpolation-filters="sRGB">
        <feDropShadow dx="1.5" dy="3" stdDeviation="2" flood-color="#141720" flood-opacity=".32"/>
      </filter>
      <filter id="second-shadow" filterUnits="userSpaceOnUse" x="65" y="65" width="470" height="470" color-interpolation-filters="sRGB">
        <feDropShadow dx="2" dy="4" stdDeviation="1.8" flood-color="#141720" flood-opacity=".24"/>
      </filter>
      <filter id="cap-shadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
        <feDropShadow dx=".8" dy="1.5" stdDeviation="1" flood-color="#101310" flood-opacity=".4"/>
      </filter>
      <linearGradient id="red" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#ff343c"/><stop offset=".3" stop-color="#d7202c"/><stop offset=".68" stop-color="#b51022"/><stop offset="1" stop-color="#e52635"/></linearGradient>
      <radialGradient id="dial"><stop stop-color="#ffffff"/><stop offset=".8" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></radialGradient>
      <linearGradient id="lume" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
      <linearGradient id="facet" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#70000a" stop-opacity="0"/><stop offset="1" stop-color="#60000c" stop-opacity=".65"/></linearGradient>
      <linearGradient id="facet-light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7d7e" stop-opacity=".28"/><stop offset="1" stop-color="#ef3340" stop-opacity="0"/></linearGradient>
    </defs>
    <g id="bezel"></g>
    <circle cx="300" cy="300" r="237.9" fill="url(#dial)"/>
    <circle cx="300" cy="300" r="207" fill="#242b25"/>
    <circle cx="300" cy="300" r="186.6" fill="url(#lume)"/>
    <g id="marks"></g>
    <g id="indices" fill="url(#lume)" stroke="#28312b" stroke-width="2.8"></g>
    <g id="bezel-type" fill="none" stroke="#ffffff" stroke-width="5.8" stroke-linecap="square" stroke-linejoin="round"></g>
    <image id="tag-heuer-logo" href="tag-heuer-logo.svg" x="254" y="176" width="92" height="79.58" aria-label="TAG Heuer"/>
    <g id="formula" fill="none" stroke="#252d27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-label="Formula 1"></g>
    <g filter="url(#hand-shadow)">
    <g id="hour" class="hand">
      <path d="M293 321 L293 205 L300 176 L307 205 L307 321 L300 328 Z" fill="#252d28" stroke="#111914" stroke-width="1.5"/>
      <path d="M296 264 V210 H304 V264 Z" fill="url(#lume)"/>
      <path d="M295 199 L300 184 L305 199 Z" fill="url(#lume)"/>
      <circle cx="300" cy="300" r="18" transform="translate(0 -87)" fill="url(#lume)" stroke="#28312c" stroke-width="3"/>
      <path d="M300 195 V213 L284.5 222 M300 213 L315.5 222" fill="none" stroke="#28312c" stroke-width="2.5"/>
    </g>
    </g>
    <g filter="url(#hand-shadow)">
    <g id="minute" class="hand">
      <path d="M293 327 V109 L300 99 L307 109 V327 L300 332 Z" fill="#252d28" stroke="#111914" stroke-width="1.5"/>
      <path d="M295 110 L300 104 L305 110 V228 H295 Z" fill="url(#lume)"/>
    </g>
    </g>
    <g filter="url(#second-shadow)">
    <g id="second" class="hand">
      <!-- The long blade starts at 40% of the cap diameter; the counterweight starts at 75%. -->
      <path d="M300 96 L301.44 108 L303.2 300 H296.8 L298.56 108 Z" fill="#ce2634" stroke="#b81827" stroke-width=".5" stroke-linejoin="round"/>
      <path d="M294 300 H306 L305.25 340 L300 348 L294.75 340 Z" fill="#ce2634" stroke="#b81827" stroke-width=".5" stroke-linejoin="round"/>
    </g>
    </g>
    <circle cx="300" cy="300" r="8" fill="#171b17" stroke="#888888" stroke-width="1.5" filter="url(#cap-shadow)"/>
  </svg>
  <div class="controls" aria-label="Time simulation speed">
    <button data-speed="1" aria-pressed="true">1×</button>
    <button data-speed="10" aria-pressed="false">10×</button>
    <button data-speed="60" aria-pressed="false">60×</button>
    <button data-speed="600" aria-pressed="false">600×</button>
    <button id="pause" aria-pressed="false">Pause</button>
    <button id="boundary">11:59:55</button>
    <button id="three-boundary">2:59:55</button>
    <button id="reset">Reset to now</button>
    <button id="fullscreen">Full screen</button>
  </div>
  <output id="status" aria-live="off"></output>
  <p class="hint">Time controls are for animation testing · 600× = ten clock minutes per second</p>
</main>
<script>
  'use strict';
  var ns = 'http://www.w3.org/2000/svg';
  var marks = document.getElementById('marks');
  function element(parent, name, attrs) {
    var el = document.createElementNS(ns, name);
    Object.keys(attrs).forEach(function (key) { el.setAttribute(key, attrs[key]); });
    parent.appendChild(el); return el;
  }
  var bezel = document.getElementById('bezel');
  var outline = '';
  // Twelve grip notches, centered halfway between the five-minute labels.
  for (var n = 0; n <= 720; n++) {
    var angle = n / 720 * Math.PI * 2 - Math.PI / 2;
    var notch = Math.pow((1 - Math.cos(angle * 12)) / 2, 10);
    var radius = 291 - notch * 9;
    outline += (n ? ' L' : 'M') + (300 + Math.cos(angle) * radius) + ' ' + (300 + Math.sin(angle) * radius);
  }
  element(bezel, 'path', {d:outline + ' Z', fill:'url(#red)', stroke:'#8d0c19', 'stroke-width':2});
  for (var f = 0; f < 12; f++) {
    // Triangular cut faces stop at radius 266, clear of the dot track (254).
    var facetRotation = 'rotate(' + (15 + f * 30) + ' 300 300)';
    element(bezel, 'path', {d:'M283 10 L300 18 L300 34 Z', fill:'url(#facet)', transform:facetRotation});
    element(bezel, 'path', {d:'M300 18 L317 10 L300 34 Z', fill:'url(#facet-light)', transform:facetRotation});
  }
  var indices = document.getElementById('indices');
  for (var i = 0; i < 60; i++) {
    var rotation = 'rotate(' + i * 6 + ' 300 300)';
    // Leave the track clear beneath each quarter-hour marker and its white rim.
    var quarterDistance = Math.min(i % 15, 15 - i % 15);
    if (quarterDistance > 1) {
      element(marks, i % 5 === 0 ? 'rect' : 'circle', i % 5 === 0 ?
        {x:296.4,y:95.4,width:7.2,height:15.6,fill:'url(#lume)',transform:rotation} :
        {cx:300,cy:103.2,r:5.4,fill:'url(#lume)',transform:rotation});
    }
    if (i % 5 !== 0) element(bezel,'circle',{cx:300,cy:55.1,r:3.2,fill:'#ffffff',transform:rotation});
  }
  for (var h = 0; h < 12; h++) {
    var rot = 'rotate(' + h * 30 + ' 300 300)';
    if (h % 3 === 0) {
      // A 2.8-unit white rim surrounds the same 2.8-unit dark outline as the circles.
      var quarterTransform = rot + ' translate(300 128) scale(.855) translate(-300 -128)';
      var quarterMarker = 'M277 101 H323 V137 L300 155 L277 137 Z';
      element(indices,'path',{d:quarterMarker,fill:'none',stroke:'#ffffff','stroke-width':8.4,'stroke-linejoin':'miter','vector-effect':'non-scaling-stroke',transform:quarterTransform});
      element(indices,'path',{d:quarterMarker,'stroke-linejoin':'miter','vector-effect':'non-scaling-stroke',transform:quarterTransform});
      element(indices,'path',{d:'M279 115 H321',fill:'none','vector-effect':'non-scaling-stroke',transform:quarterTransform});
    } else {
      var rad = h * Math.PI / 6;
      element(indices,'circle',{cx:300 + Math.sin(rad)*164,cy:300-Math.cos(rad)*164,r:16});
    }
  }
  // Custom outline lettering keeps the face independent of system fonts.
  var glyphs = {
    '0':'M2 0 H16 Q18 0 18 2 V26 Q18 28 16 28 H2 Q0 28 0 26 V2 Q0 0 2 0 Z',
    '1':'M5 0 H10 V28', '2':'M0 0 H18 V13 H0 V28 H18',
    '3':'M0 0 H18 V28 H0 M2 14 H18', '4':'M0 0 V14 H18 M18 0 V28',
    '5':'M18 0 H0 V14 H18 V28 H0',
    'F':'M0 28 V0 H18 M0 13 H15',
    'O':'M3 0 H15 Q18 0 18 3 V25 Q18 28 15 28 H3 Q0 28 0 25 V3 Q0 0 3 0 Z',
    'R':'M0 28 V0 H15 Q18 0 18 3 V10 Q18 13 15 13 H0 M10 13 L18 28',
    'M':'M0 28 V1 Q0 0 .822 1 L10.565 27 L20.309 1 Q21.13 0 21.13 1 V28',
    'U':'M0 0 V23 Q0 28 5 28 H13 Q18 28 18 23 V0',
    'L':'M0 0 V27 Q0 28 1 28 H18',
    'A':'M0 28 L8 1.5 Q9 -.5 10 1.5 L18 28 M3.9 20 H14.1'
  };
  function lettering(parent, text, x, y, scale, spacing) {
    var group = element(parent,'g',{transform:'translate('+x+' '+y+') scale('+scale+')'});
    text.split('').forEach(function(c,j) { if(glyphs[c]) element(group,'path',{d:glyphs[c],transform:'translate('+j*spacing+' 0)'}); });
    return group;
  }
  // Filled bezel glyphs share the proportions and six-unit bars of the traced 30.
  var bezelGlyphs = {
    '0':'M3 0 H17 Q20 0 20 3 V27 Q20 30 17 30 H3 Q0 30 0 27 V3 Q0 0 3 0 Z M6.5 6 Q5.5 6 5.5 7 V23 Q5.5 24 6.5 24 H13.5 Q14.5 24 14.5 23 V7 Q14.5 6 13.5 6 Z',
    '1':'M7 0 H12 Q13 0 13 1 V29 Q13 30 12 30 H8.5 Q7.5 30 7.5 29 V6 H5 Q4 6 4 5 V2 Q4 1 5 1 Z',
    '2':'M2 0 H18 Q20 0 20 2 V16 Q20 18 18 18 H7 Q5.5 18 5.5 19.5 V24 H18.8 Q20 24 20 25.2 V28.8 Q20 30 18.8 30 H2 Q0 30 0 28 V14 Q0 12 2 12 H13 Q14.5 12 14.5 10.5 V7.5 Q14.5 6 13 6 H1.2 Q0 6 0 4.8 V2 Q0 0 2 0 Z',
    '3':'M1.2 0 H18 Q20 0 20 2 V11.5 Q20 14 18.5 15 Q20 16 20 18.5 V28 Q20 30 18 30 H1.2 Q0 30 0 28.8 V25 Q0 24 1.2 24 H13 Q14.5 24 14.5 22.5 V19.5 Q14.5 18 13 18 H1.5 Q.3 18 .3 16.8 V13.2 Q.3 12 1.5 12 H13 Q14.5 12 14.5 10.5 V7.5 Q14.5 6 13 6 H1.2 Q0 6 0 4.8 V1.2 Q0 0 1.2 0 Z',
    '4':'M11.4 0 H15.3 Q16.5 0 16.5 1.2 V18 H18.8 Q20 18 20 19.2 V22.8 Q20 24 18.8 24 H16.5 V28.8 Q16.5 30 15.3 30 H11.7 Q10.5 30 10.5 28.8 V24 H1.5 Q0 24 0 22.5 V19.2 Q0 18.6 .5 17.8 L9.7 1.1 Q10.3 0 11.4 0 Z M5.8 18 H10.5 V9.4 Z',
    '5':'M2 0 H18.8 Q20 0 20 1.2 V4.8 Q20 6 18.8 6 H5.5 V10.5 Q5.5 12 7 12 H18 Q20 12 20 14 V28 Q20 30 18 30 H1.2 Q0 30 0 28.8 V25.2 Q0 24 1.2 24 H13 Q14.5 24 14.5 22.5 V19.5 Q14.5 18 13 18 H2 Q0 18 0 16 V2 Q0 0 2 0 Z'
  };
  var bezelType = document.getElementById('bezel-type');
  for(var digit=1; digit<12; digit++) {
    var group = element(bezelType,'g',{transform:'rotate('+digit*30+' 300 300)'});
    var numerals = element(group,'g',{transform:'translate(278.22 17) scale(.99 .94)',fill:'#ffffff',stroke:'none'});
    String(digit*5).padStart(2,'0').split('').forEach(function(character,index) {
      element(numerals,'path',{d:bezelGlyphs[character],transform:'translate('+index*24+' 0)','fill-rule':'evenodd'});
    });
    element(group,'rect',{x:292,y:52.1,width:16,height:6,fill:'#ffffff',stroke:'none',rx:0.7});
  }
  element(bezelType,'path',{d:'M274 13.55 H326 L300 47.55 Z',fill:'#ffffff',stroke:'none'});
  element(bezelType,'circle',{cx:300,cy:25.3,r:9,fill:'#c81b2a',stroke:'none'});
  element(bezelType,'rect',{x:292,y:52.1,width:16,height:6,fill:'#ffffff',stroke:'none',rx:0.7});
  var formulaLetters = lettering(document.getElementById('formula'),'FORMULA 1',204,378,0.78,32);
  formulaLetters.setAttribute('transform','translate(203.42 378) scale(.78 .62)');
  // Broader letterforms match the reference while retaining the existing spacing.
  Array.from(formulaLetters.children).forEach(function(letter) {
    letter.setAttribute('transform', letter.getAttribute('transform') + ' scale(1.15 1)');
  });
  formulaLetters.children[3].setAttribute('transform','translate(94.2 0) scale(1.15 1)');
  formulaLetters.lastElementChild.setAttribute('transform','translate(232 0) scale(1.15 1)');
  var hands = ['hour', 'minute', 'second'].map(function (id) { return document.getElementById(id); });
  var speed = 1, paused = false, live = true;
  var baseTime = Date.now(), baseTick = performance.now(), lastStatus = 0;
  var statusElement = document.getElementById('status');
  function simulatedTime(tick) {
    return live && !paused ? Date.now() : baseTime + (paused ? 0 : (tick - baseTick) * speed);
  }
  function anchor() { var tick = performance.now(); baseTime = simulatedTime(tick); baseTick = tick; }
  function updateControls() {
    document.querySelectorAll('[data-speed]').forEach(function (button) {
      button.setAttribute('aria-pressed', String(Number(button.dataset.speed) === speed));
    });
    document.getElementById('pause').textContent = paused ? 'Resume' : 'Pause';
    document.getElementById('pause').setAttribute('aria-pressed', String(paused));
    lastStatus = -Infinity;
  }
  document.querySelectorAll('[data-speed]').forEach(function (button) {
    button.onclick = function () { anchor(); speed = Number(button.dataset.speed); live = false; paused = false; updateControls(); };
  });
  document.getElementById('pause').onclick = function () { anchor(); paused = !paused; live = false; updateControls(); };
  document.getElementById('boundary').onclick = function () {
    var date = new Date(); date.setHours(11, 59, 55, 0);
    baseTime = date.getTime(); baseTick = performance.now(); live = false; updateControls();
  };
  document.getElementById('three-boundary').onclick = function () {
    var date = new Date(); date.setHours(2, 59, 55, 0);
    baseTime = date.getTime(); baseTick = performance.now(); live = false; updateControls();
  };
  document.getElementById('reset').onclick = function () {
    baseTime = Date.now(); baseTick = performance.now(); speed = 1; paused = false; live = true; updateControls();
  };
  document.getElementById('fullscreen').onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  };
  function frame(tick) {
    var date = new Date(simulatedTime(tick));
    var seconds = date.getSeconds() + date.getMilliseconds() / 1000;
    // The minute hand advances during the first second after each minute.
    // The hour and second hands sweep continuously.
    var minuteProgress = Math.min(seconds, 1);
    minuteProgress = minuteProgress * minuteProgress * (3 - 2 * minuteProgress);
    var minutes = date.getMinutes() - 1 + minuteProgress;
    var hours = date.getHours() % 12 + (date.getMinutes() + seconds / 60) / 60;
    [hours * 30, minutes * 6, seconds * 6].forEach(function (angle, index) {
      hands[index].style.transform = 'rotate(' + angle + 'deg)';
    });
    if (tick - lastStatus > 100) {
      statusElement.textContent = date.toLocaleTimeString('en-US', {hour12: false}) + ' · ' + (paused ? 'PAUSED' : live ? 'LIVE' : speed + '× SIMULATION');
      lastStatus = tick;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
