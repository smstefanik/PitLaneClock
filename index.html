    var date = new Date(); date.setHours(2, 59, 55, 0);
    baseTime = date.getTime(); baseTick = performance.now(); live = false; updateControls();
  };
  document.getElementById('test-live').onclick = function () {
    var now = Date.now();
    var session = sessions.find(function (item) { return now < item.end; }) || sessions[0];
    baseTime = session.start.getTime() + (session.end - session.start) / 2;
    baseTick = performance.now(); speed = 1; paused = false; live = false; updateControls();
  };
  document.getElementById('reset').onclick = function () {
    baseTime = Date.now(); baseTick = performance.now(); speed = 1; paused = false; live = true; updateControls();
  };
  document.getElementById('fullscreen').onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  };
  function frame(tick) {
    var date = new Date(simulatedTime(tick));
    if (tick - lastStatus > 100 || !activeRace) synchronizeRace(date.getTime());
    var trackParts = {};
    trackFormatter.formatToParts(date).forEach(function (part) { trackParts[part.type] = part.value; });
    var displayHour = selectedZone === 'track' ? Number(trackParts.hour) : date.getHours();
    var displayMinute = selectedZone === 'track' ? Number(trackParts.minute) : date.getMinutes();
    var seconds = date.getSeconds() + date.getMilliseconds() / 1000;
    // The minute hand advances during the first second after each minute.
    // The hour and second hands sweep continuously.
    var minuteProgress = Math.min(seconds, 1);
    minuteProgress = minuteProgress * minuteProgress * (3 - 2 * minuteProgress);
    var minutes = displayMinute - 1 + minuteProgress;
    var hours = displayHour % 12 + (displayMinute + seconds / 60) / 60;
    var targetAngles = [hours * 30, minutes * 6, seconds * 6];
    var transitionProgress = 1;
    if (zoneTransition) {
      if (zoneTransition.start === null) {
        zoneTransition.start = tick;
        zoneTransition.offsets = targetAngles.map(function (angle, index) {
          return ((zoneTransition.from[index] - angle) % 360 + 540) % 360 - 180;
        });
      }
      transitionProgress = Math.min((tick - zoneTransition.start) / 900, 1);
      transitionProgress = transitionProgress * transitionProgress * (3 - 2 * transitionProgress);
    }
    targetAngles.forEach(function (angle, index) {
      if (zoneTransition) angle += zoneTransition.offsets[index] * (1 - transitionProgress);
      displayedAngles[index] = angle;
      hands[index].style.transform = 'rotate(' + angle + 'deg)';
    });
    if (transitionProgress === 1) zoneTransition = null;
    if (tick - lastStatus > 100) {
      sessions.forEach(function (session) {
        var finished = date >= session.end;
        session.element.classList.toggle('finished', finished);
        session.badge.hidden = !(date >= session.start && date < session.end);
        var formatter = selectedZone === 'track' ? trackFormatter : localFormatter;
        session.range.textContent = finished ? 'FINISHED' : formatter.format(session.start).slice(0, 5) + ' – ' + formatter.format(session.end).slice(0, 5);
        var dateFormatter = selectedZone === 'track' ? trackDateFormatter : localDateFormatter;
        var dateParts = {};
        dateFormatter.formatToParts(session.start).forEach(function (part) { dateParts[part.type] = part.value; });
        var sessionDate = session.element.querySelector('.session-date');
        sessionDate.firstChild.nodeValue = dateParts.month.toUpperCase();
        sessionDate.querySelector('span').textContent = dateParts.day;
      });
      localTime.textContent = localFormatter.format(date);
      trackTime.textContent = trackParts.hour + ':' + trackParts.minute;
      statusElement.textContent = String(displayHour).padStart(2, '0') + ':' + String(displayMinute).padStart(2, '0') + ':' + String(date.getSeconds()).padStart(2, '0') + ' · ' + (paused ? 'PAUSED' : live ? 'LIVE' : speed + '× SIMULATION');
      lastStatus = tick;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
