<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pit Lane Clock</title>
  <style>
    @font-face { font-family: Formula1; src: url("assets/fonts/Formula1-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: Formula1; src: url("assets/fonts/Formula1-Bold.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    main { min-height: 100vh; max-width: 1600px; margin: auto; display: flex; flex-direction: column; justify-content: center; padding: 40px 48px; gap: 42px; }
    .race-header { display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .formula-1-logo { display: block; width: 96px; height: auto; }
    .race-title { display: flex; align-items: center; justify-content: center; gap: 20px; }
    h1 { margin: 0; font-family: Formula1, sans-serif; font-size: clamp(20px, 2.55vw, 40px); font-weight: 400; line-height: 1.35; letter-spacing: 0; text-transform: uppercase; }
    .mexican-flag { width: clamp(36px, 3.5vw, 52px); height: auto; flex-shrink: 0; display: block; }
    .clock-layout { display: grid; grid-template-columns: minmax(248px, 336px) minmax(0, 760px); align-items: center; justify-content: center; gap: clamp(40px, 6vw, 100px); }
    .clock-layout > svg { width: 100%; height: auto; overflow: visible; }
    .schedule { width: 100%; }
    .time-selector { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 5px; background: #111113; border: 1px solid #252528; border-radius: 9px; }
    .time-option, .time-option:hover, .time-option[aria-pressed="true"] { position: relative; background: transparent; border: 0; border-radius: 5px; padding: 12px 14px 15px; color: #919196; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; line-height: 1.2; transition: background .18s, color .18s; }
    .time-option:hover { background: #1b1b1e; color: #ddd; }
    .time-option[aria-pressed="true"] { background: #202023; color: #fff; }
    .time-option::after { content: ""; position: absolute; bottom: 0; left: 14px; right: 14px; height: 3px; border-radius: 2px; background: #ed241c; opacity: 0; transition: opacity .18s; }
    .time-option[aria-pressed="true"]::after { opacity: 1; }
    .time-option span { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
    .time-option time { font: 24px ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .time-option:focus-visible { outline-offset: -2px; }
    .sessions { list-style: none; margin: 12px 0 0; padding: 0; }
    .session { display: grid; grid-template-columns: 64px 1fr; gap: 22px; align-items: center; padding: 22px 0; border-bottom: 1px solid #25252c; }
    .session:last-child { border-bottom: 0; }
    .session-date { border-right: 1px solid #34343b; font-size: 23px; font-weight: 900; line-height: 1.05; }
    .session-date span { display: block; margin-top: 7px; color: #aaa; font: 17px ui-monospace, monospace; }
    .session h3 { font-family: Formula1, sans-serif; margin: 0 0 7px; font-size: clamp(20px, 2vw, 27px); font-weight: 500; text-transform: uppercase; letter-spacing: 0; }
    .session-time { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: #eee; font: 18px ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .session-live { display: inline-flex; align-items: center; gap: 5px; padding: 4px 6px; border-radius: 4px; background: #ed241c; color: #fff; font: 700 10px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: .8px; }
    .session-live::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .session-live[hidden] { display: none; }
    .session.finished .session-time { color: #888; }
    .session > div:last-child { position: relative; padding-left: 32px; }
    .session.finished h3::before { content: ""; position: absolute; left: 0; top: 2px; width: 20px; height: 24px; background: url("assets/checkered-flag.svg") center / contain no-repeat; }
    @media (max-width: 900px) { main { padding: 30px 24px; gap: 30px; } .clock-layout { grid-template-columns: minmax(216px, 272px) minmax(0, 1fr); gap: 28px; } .session { gap: 14px; padding: 18px 0; } }
    @media (max-width: 650px) { main { padding: 28px 20px; } .race-header { gap: 18px; } .formula-1-logo { width: 80px; } .race-title { align-items: flex-start; gap: 12px; } .clock-layout { display: flex; flex-direction: column-reverse; gap: 32px; } .clock-layout > svg { width: min(85vw, 480px); } .schedule { max-width: 384px; } }
    .hand { transform-origin: 300px 300px; }
    .awake-controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; }
    #awake-status { color: #999; font-size: 13px; }
    button:disabled { opacity: .5; cursor: default; }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 680px; }
    .debug-panel { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .debug-panel[hidden] { display: none; }
    #tag-heuer-logo, #bezel-debug-toggle { cursor: pointer; }
    #tag-heuer-logo:focus-visible, #bezel-debug-toggle:focus-visible { outline: 2px solid #ff3a3a; outline-offset: 3px; }
    .clock-layout > svg * {
      transition: stop-color .6s ease-in-out, fill .6s ease-in-out, stroke .6s ease-in-out, opacity .6s ease-in-out, filter .6s ease-in-out;
    }
    @media (prefers-reduced-motion: reduce) {
      .clock-layout > svg * { transition: none; }
    }
    .clock-dark #dial stop, .clock-dark #dial-center stop { stop-color: #080f0e; }
    .clock-dark #lume stop { stop-color: #a9ffd8; }
    .clock-dark #red stop { stop-color: #080f0e; }
    .clock-dark #red stop:nth-child(even) { stop-color: #341116; }
    .clock-dark .dial-track { fill: #111c21; }
    .clock-dark #bezel > path:first-child { stroke: #341116; }
    .clock-dark #bezel > circle, .clock-dark #bezel-type [fill="#ffffff"] { fill: #b2ccc3; }
    .clock-dark #indices [stroke="#ffffff"] { stroke: #080f0e; }
    .clock-dark #marks, .clock-dark #indices, .clock-dark #hour, .clock-dark #minute { filter: drop-shadow(0 0 5px #a9ffd888); }
    .clock-dark #second path { fill: #ff394b; stroke: #ff394b; }
    .clock-dark #second { filter: drop-shadow(0 0 2.5px #ff394b55); }
    /* Animate each letter directly so nested groups do not re-transition an inherited stroke. */
    #formula path { stroke: #252d27; }
    .clock-dark #formula path { stroke: #b2ccc3; }
    #tag-heuer-logo .logo-dark { opacity: 0; filter: drop-shadow(0 0 1.3px #a9ffd855); }
    .clock-dark #tag-heuer-logo .logo-light { opacity: 0; }
    .clock-dark #tag-heuer-logo .logo-dark { opacity: 1; }
    button { background: #171717; color: #ffffff; border: 1px solid #383838; border-radius: 7px; padding: 10px 15px; font: inherit; cursor: pointer; }
    button:hover { background: #292929; }
    button[aria-pressed="true"] { background: #ffffff; color: #111; border-color: #ffffff; }
    button:focus-visible { outline: 2px solid #ff3a3a; outline-offset: 3px; }
    output { font: 14px ui-monospace, monospace; color: #999; text-align: center; min-height: 20px; }
    .hint { color: #555; font-size: 12px; margin: 0; }
  </style>
</head>
<body>

    </defs>

  </div>
  <div class="awake-controls">
    <button id="keep-awake" aria-pressed="true" aria-describedby="awake-status">Keep awake</button>
    <span id="awake-status" role="status">Enabling…</span>
  </div>
  <output id="status" aria-live="off"></output>
  <p class="hint">Time controls are for animation testing · 600× = ten clock minutes per second</p>
  </div>
</main>
<script>
  'use strict';
  var awakeButton = document.getElementById('keep-awake');
  var awakeStatus = document.getElementById('awake-status');
  var wakeLockSupported = window.isSecureContext && 'wakeLock' in navigator;
  var wakeLock = null, keepAwake = wakeLockSupported, wakeLockPending = false;
  function updateAwakeControls(message) {
    awakeButton.disabled = !wakeLockSupported || wakeLockPending;
    awakeButton.setAttribute('aria-pressed', String(keepAwake));
    awakeStatus.textContent = message || (!wakeLockSupported ? 'Keep awake is unavailable in this browser or connection.' :
      wakeLockPending ? 'Enabling…' : !keepAwake ? 'Off' :
      wakeLock && !wakeLock.released ? 'Screen will stay awake' : 'Paused — resumes when you return to this page');
  }
  async function requestWakeLock() {
    if (!wakeLockSupported || !keepAwake || wakeLockPending || document.visibilityState !== 'visible' || (wakeLock && !wakeLock.released)) return;
    wakeLockPending = true;
    updateAwakeControls();
    try {
      var lock = await navigator.wakeLock.request('screen');
      wakeLock = lock;
      lock.addEventListener('release', function () {
        if (wakeLock !== lock) return;
        wakeLock = null;
        updateAwakeControls(keepAwake && document.visibilityState === 'visible' ? 'Keep awake was interrupted. Turn it off and on to retry.' : undefined);
      });
      if (!keepAwake) await lock.release();
    } catch (error) {
      keepAwake = false;
      wakeLockPending = false;
      updateAwakeControls('Could not keep the screen awake. Try again.');
      return;
    } finally {
      wakeLockPending = false;
    }
    updateAwakeControls();
  }
  awakeButton.addEventListener('click', async function () {
    keepAwake = !keepAwake;
    if (keepAwake) {
      await requestWakeLock();
    } else {
      var lock = wakeLock;
      wakeLock = null;
      updateAwakeControls();
      if (lock) {
        try { await lock.release(); } catch (error) { /* The browser may already have released it. */ }
      }
    }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') requestWakeLock();
  });
  updateAwakeControls();
  requestWakeLock();
  var logo = document.getElementById('tag-heuer-logo');
  var debugPanel = document.getElementById('debug-panel');
  function toggleClockTheme() {
    var dark = logo.ownerSVGElement.classList.toggle('clock-dark');
    logo.setAttribute('aria-pressed', String(dark));
  }
  function toggleDebugControls() {
    debugPanel.hidden = !debugPanel.hidden;
    document.getElementById('bezel-debug-toggle').setAttribute('aria-expanded', String(!debugPanel.hidden));
  }
  logo.addEventListener('click', toggleClockTheme);
  logo.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggleClockTheme();
    }
  });
  var selectedZone = 'local';
  var trackFormatter = new Intl.DateTimeFormat('en-GB', { timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
  var localFormatter = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  var trackDateFormatter = new Intl.DateTimeFormat('en-GB', { timeZone: 'America/Mexico_City', month: 'short', day: '2-digit' });
  var localDateFormatter = new Intl.DateTimeFormat('en-GB', { month: 'short', day: '2-digit' });
  var sessions = Array.from(document.querySelectorAll('.session')).map(function (session) {
    var time = session.querySelector('.session-time');
    var range = document.createElement('span');
    var badge = document.createElement('span');
    badge.className = 'session-live';
    badge.textContent = 'LIVE';
    badge.hidden = true;
    time.append(range, badge);
    return { element: session, start: new Date(session.dataset.start), end: new Date(session.dataset.end), range: range, badge: badge };
  });
  var localTime = document.getElementById('local-time');
  var trackTime = document.getElementById('track-time');
  document.querySelectorAll('[data-zone]').forEach(function (button) {
    button.addEventListener('click', function () {
      if (selectedZone === button.dataset.zone) return;
      zoneTransition = { from: displayedAngles.slice(), start: null, offsets: null };
      selectedZone = button.dataset.zone;
      document.querySelectorAll('[data-zone]').forEach(function (option) {
        option.setAttribute('aria-pressed', String(option.dataset.zone === selectedZone));
      });
      lastStatus = -Infinity;
    });
  });
  var ns = 'http://www.w3.org/2000/svg';
  var marks = document.getElementById('marks');
  function element(parent, name, attrs) {
    var el = document.createElementNS(ns, name);
    Object.keys(attrs).forEach(function (key) { el.setAttribute(key, attrs[key]); });
    parent.appendChild(el); return el;
  }
  var bezel = document.getElementById('bezel');
  var outline = '';
  // Twelve grip notches, centered halfway between the five-minute labels.
  for (var n = 0; n <= 720; n++) {
    var angle = n / 720 * Math.PI * 2 - Math.PI / 2;
    var notch = Math.pow((1 - Math.cos(angle * 12)) / 2, 10);
    var radius = 291 - notch * 9;
    outline += (n ? ' L' : 'M') + (300 + Math.cos(angle) * radius) + ' ' + (300 + Math.sin(angle) * radius);
  }
  element(bezel, 'path', {d:outline + ' Z', fill:'url(#red)', stroke:'#8d0c19', 'stroke-width':2});
  for (var f = 0; f < 12; f++) {
    // Triangular cut faces stop at radius 266, clear of the dot track (254).
    var facetRotation = 'rotate(' + (15 + f * 30) + ' 300 300)';
    element(bezel, 'path', {d:'M283 10 L300 18 L300 34 Z', fill:'url(#facet)', transform:facetRotation});
    element(bezel, 'path', {d:'M300 18 L317 10 L300 34 Z', fill:'url(#facet-light)', transform:facetRotation});
  }
  var indices = document.getElementById('indices');
  for (var i = 0; i < 60; i++) {
    var rotation = 'rotate(' + i * 6 + ' 300 300)';
    // Leave the track clear beneath each quarter-hour marker and its white rim.
    var quarterDistance = Math.min(i % 15, 15 - i % 15);
    if (quarterDistance > 1) {
      element(marks, i % 5 === 0 ? 'rect' : 'circle', i % 5 === 0 ?
        {x:296.4,y:95.4,width:7.2,height:15.6,fill:'url(#lume)',transform:rotation} :
        {cx:300,cy:103.2,r:5.4,fill:'url(#lume)',transform:rotation});
    }
    if (i % 5 !== 0) element(bezel,'circle',{cx:300,cy:55.1,r:3.2,fill:'#ffffff',transform:rotation});
  }
  for (var h = 0; h < 12; h++) {
    var rot = 'rotate(' + h * 30 + ' 300 300)';
    if (h % 3 === 0) {
      // A 2.8-unit white rim surrounds the same 2.8-unit dark outline as the circles.
      var quarterTransform = rot + ' translate(300 128) scale(.855) translate(-300 -128)';
      var quarterMarker = 'M277 101 H323 V137 L300 155 L277 137 Z';
      element(indices,'path',{d:quarterMarker,fill:'none',stroke:'#ffffff','stroke-width':8.4,'stroke-linejoin':'miter','vector-effect':'non-scaling-stroke',transform:quarterTransform});
      element(indices,'path',{d:quarterMarker,'stroke-linejoin':'miter','vector-effect':'non-scaling-stroke',transform:quarterTransform});
      element(indices,'path',{d:'M279 115 H321',fill:'none','vector-effect':'non-scaling-stroke',transform:quarterTransform});
    } else {
      var rad = h * Math.PI / 6;
      element(indices,'circle',{cx:300 + Math.sin(rad)*164,cy:300-Math.cos(rad)*164,r:16});
    }
  }
  // Custom outline lettering keeps the face independent of system fonts.
  var glyphs = {
    '0':'M2 0 H16 Q18 0 18 2 V26 Q18 28 16 28 H2 Q0 28 0 26 V2 Q0 0 2 0 Z',
    '1':'M5 0 H10 V28', '2':'M0 0 H18 V13 H0 V28 H18',
    '3':'M0 0 H18 V28 H0 M2 14 H18', '4':'M0 0 V14 H18 M18 0 V28',
    '5':'M18 0 H0 V14 H18 V28 H0',
    'F':'M0 28 V0 H18 M0 13 H15',
    'O':'M3 0 H15 Q18 0 18 3 V25 Q18 28 15 28 H3 Q0 28 0 25 V3 Q0 0 3 0 Z',
    'R':'M0 28 V0 H15 Q18 0 18 3 V10 Q18 13 15 13 H0 M10 13 L18 28',
    'M':'M0 28 V1 Q0 0 .822 1 L10.565 27 L20.309 1 Q21.13 0 21.13 1 V28',
    'U':'M0 0 V23 Q0 28 5 28 H13 Q18 28 18 23 V0',
    'L':'M0 0 V27 Q0 28 1 28 H18',
    'A':'M0 28 L8 1.5 Q9 -.5 10 1.5 L18 28 M3.9 20 H14.1'
  };
  function lettering(parent, text, x, y, scale, spacing) {
    var group = element(parent,'g',{transform:'translate('+x+' '+y+') scale('+scale+')'});
    text.split('').forEach(function(c,j) { if(glyphs[c]) element(group,'path',{d:glyphs[c],transform:'translate('+j*spacing+' 0)'}); });
    return group;
  }
  // Filled bezel glyphs share the proportions and six-unit bars of the traced 30.
  var bezelGlyphs = {
    '0':'M3 0 H17 Q20 0 20 3 V27 Q20 30 17 30 H3 Q0 30 0 27 V3 Q0 0 3 0 Z M6.5 6 Q5.5 6 5.5 7 V23 Q5.5 24 6.5 24 H13.5 Q14.5 24 14.5 23 V7 Q14.5 6 13.5 6 Z',
    '1':'M7 0 H12 Q13 0 13 1 V29 Q13 30 12 30 H8.5 Q7.5 30 7.5 29 V6 H5 Q4 6 4 5 V2 Q4 1 5 1 Z',
    '2':'M2 0 H18 Q20 0 20 2 V16 Q20 18 18 18 H7 Q5.5 18 5.5 19.5 V24 H18.8 Q20 24 20 25.2 V28.8 Q20 30 18.8 30 H2 Q0 30 0 28 V14 Q0 12 2 12 H13 Q14.5 12 14.5 10.5 V7.5 Q14.5 6 13 6 H1.2 Q0 6 0 4.8 V2 Q0 0 2 0 Z',
    '3':'M1.2 0 H18 Q20 0 20 2 V11.5 Q20 14 18.5 15 Q20 16 20 18.5 V28 Q20 30 18 30 H1.2 Q0 30 0 28.8 V25 Q0 24 1.2 24 H13 Q14.5 24 14.5 22.5 V19.5 Q14.5 18 13 18 H1.5 Q.3 18 .3 16.8 V13.2 Q.3 12 1.5 12 H13 Q14.5 12 14.5 10.5 V7.5 Q14.5 6 13 6 H1.2 Q0 6 0 4.8 V1.2 Q0 0 1.2 0 Z',
    '4':'M11.4 0 H15.3 Q16.5 0 16.5 1.2 V18 H18.8 Q20 18 20 19.2 V22.8 Q20 24 18.8 24 H16.5 V28.8 Q16.5 30 15.3 30 H11.7 Q10.5 30 10.5 28.8 V24 H1.5 Q0 24 0 22.5 V19.2 Q0 18.6 .5 17.8 L9.7 1.1 Q10.3 0 11.4 0 Z M5.8 18 H10.5 V9.4 Z',
    '5':'M2 0 H18.8 Q20 0 20 1.2 V4.8 Q20 6 18.8 6 H5.5 V10.5 Q5.5 12 7 12 H18 Q20 12 20 14 V28 Q20 30 18 30 H1.2 Q0 30 0 28.8 V25.2 Q0 24 1.2 24 H13 Q14.5 24 14.5 22.5 V19.5 Q14.5 18 13 18 H2 Q0 18 0 16 V2 Q0 0 2 0 Z'
  };
  var bezelType = document.getElementById('bezel-type');
  for(var digit=1; digit<12; digit++) {
    var group = element(bezelType,'g',{transform:'rotate('+digit*30+' 300 300)'});
    if (digit === 5) {
      group.setAttribute('id', 'bezel-debug-toggle');
      group.setAttribute('role', 'button');
      group.setAttribute('tabindex', '0');
      group.setAttribute('aria-label', '25 — toggle debug controls');
      group.setAttribute('aria-controls', 'debug-panel');
      group.setAttribute('aria-expanded', 'false');
      element(group, 'rect', {x:272,y:10,width:56,height:53,fill:'transparent',stroke:'none','pointer-events':'all'});
      group.addEventListener('click', toggleDebugControls);
      group.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggleDebugControls();
        }
      });
    }
    var numerals = element(group,'g',{transform:'translate(278.22 17) scale(.99 .94)',fill:'#ffffff',stroke:'none'});
    String(digit*5).padStart(2,'0').split('').forEach(function(character,index) {
      element(numerals,'path',{d:bezelGlyphs[character],transform:'translate('+index*24+' 0)','fill-rule':'evenodd'});
    });
    element(group,'rect',{x:292,y:52.1,width:16,height:6,fill:'#ffffff',stroke:'none',rx:0.7});
  }
  element(bezelType,'path',{d:'M274 13.55 H326 L300 47.55 Z',fill:'#ffffff',stroke:'none'});
  element(bezelType,'circle',{cx:300,cy:25.3,r:9,fill:'#c81b2a',stroke:'none'});
  element(bezelType,'rect',{x:292,y:52.1,width:16,height:6,fill:'#ffffff',stroke:'none',rx:0.7});
  var formulaLetters = lettering(document.getElementById('formula'),'FORMULA 1',204,378,0.78,32);
  formulaLetters.setAttribute('transform','translate(203.42 378) scale(.78 .62)');
  // Broader letterforms match the reference while retaining the existing spacing.
  Array.from(formulaLetters.children).forEach(function(letter) {
    letter.setAttribute('transform', letter.getAttribute('transform') + ' scale(1.15 1)');
  });
  formulaLetters.children[3].setAttribute('transform','translate(94.2 0) scale(1.15 1)');
  formulaLetters.lastElementChild.setAttribute('transform','translate(232 0) scale(1.15 1)');
  var hands = ['hour', 'minute', 'second'].map(function (id) { return document.getElementById(id); });
  var displayedAngles = [0, 0, 0];
  var zoneTransition = null;
  var speed = 1, paused = false, live = true;
  var baseTime = Date.now(), baseTick = performance.now(), lastStatus = 0;
  var statusElement = document.getElementById('status');
  function simulatedTime(tick) {
    return live && !paused ? Date.now() : baseTime + (paused ? 0 : (tick - baseTick) * speed);
  }
  function anchor() { var tick = performance.now(); baseTime = simulatedTime(tick); baseTick = tick; }
  function updateControls() {
    document.querySelectorAll('[data-speed]').forEach(function (button) {
      button.setAttribute('aria-pressed', String(Number(button.dataset.speed) === speed));
    });
    document.getElementById('pause').textContent = paused ? 'Resume' : 'Pause';
    document.getElementById('pause').setAttribute('aria-pressed', String(paused));
    lastStatus = -Infinity;
  }
  document.querySelectorAll('[data-speed]').forEach(function (button) {
    button.onclick = function () { anchor(); speed = Number(button.dataset.speed); live = false; paused = false; updateControls(); };
  });
  document.getElementById('pause').onclick = function () { anchor(); paused = !paused; live = false; updateControls(); };
  document.getElementById('boundary').onclick = function () {
    var date = new Date(); date.setHours(11, 59, 55, 0);
    baseTime = date.getTime(); baseTick = performance.now(); live = false; updateControls();
  };
  document.getElementById('three-boundary').onclick = function () {
    var date = new Date(); date.setHours(2, 59, 55, 0);
    baseTime = date.getTime(); baseTick = performance.now(); live = false; updateControls();
  };
  document.getElementById('test-live').onclick = function () {
    var now = Date.now();
    var session = sessions.find(function (item) { return now < item.end; }) || sessions[0];
    baseTime = session.start.getTime() + (session.end - session.start) / 2;
    baseTick = performance.now(); speed = 1; paused = false; live = false; updateControls();
  };
  document.getElementById('reset').onclick = function () {
    baseTime = Date.now(); baseTick = performance.now(); speed = 1; paused = false; live = true; updateControls();
  };
  document.getElementById('fullscreen').onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  };
  function frame(tick) {
    var date = new Date(simulatedTime(tick));
    var trackParts = {};
    trackFormatter.formatToParts(date).forEach(function (part) { trackParts[part.type] = part.value; });
    var displayHour = selectedZone === 'track' ? Number(trackParts.hour) : date.getHours();
    var displayMinute = selectedZone === 'track' ? Number(trackParts.minute) : date.getMinutes();
    var seconds = date.getSeconds() + date.getMilliseconds() / 1000;
    // The minute hand advances during the first second after each minute.
    // The hour and second hands sweep continuously.
    var minuteProgress = Math.min(seconds, 1);
    minuteProgress = minuteProgress * minuteProgress * (3 - 2 * minuteProgress);
    var minutes = displayMinute - 1 + minuteProgress;
    var hours = displayHour % 12 + (displayMinute + seconds / 60) / 60;
    var targetAngles = [hours * 30, minutes * 6, seconds * 6];
    var transitionProgress = 1;
    if (zoneTransition) {
      if (zoneTransition.start === null) {
        zoneTransition.start = tick;
        zoneTransition.offsets = targetAngles.map(function (angle, index) {
          return ((zoneTransition.from[index] - angle) % 360 + 540) % 360 - 180;
        });
      }
      transitionProgress = Math.min((tick - zoneTransition.start) / 900, 1);
      transitionProgress = transitionProgress * transitionProgress * (3 - 2 * transitionProgress);
    }
    targetAngles.forEach(function (angle, index) {
      if (zoneTransition) angle += zoneTransition.offsets[index] * (1 - transitionProgress);
      displayedAngles[index] = angle;
      hands[index].style.transform = 'rotate(' + angle + 'deg)';
    });
    if (transitionProgress === 1) zoneTransition = null;
    if (tick - lastStatus > 100) {
      sessions.forEach(function (session) {
        var finished = date >= session.end;
        session.element.classList.toggle('finished', finished);
        session.badge.hidden = !(date >= session.start && date < session.end);
        var formatter = selectedZone === 'track' ? trackFormatter : localFormatter;
        session.range.textContent = finished ? 'FINISHED' : formatter.format(session.start).slice(0, 5) + ' – ' + formatter.format(session.end).slice(0, 5);
        var dateFormatter = selectedZone === 'track' ? trackDateFormatter : localDateFormatter;
        var dateParts = {};
        dateFormatter.formatToParts(session.start).forEach(function (part) { dateParts[part.type] = part.value; });
        var sessionDate = session.element.querySelector('.session-date');
        sessionDate.firstChild.nodeValue = dateParts.month.toUpperCase();
        sessionDate.querySelector('span').textContent = dateParts.day;
      });
      localTime.textContent = localFormatter.format(date);
      trackTime.textContent = trackParts.hour + ':' + trackParts.minute;
      statusElement.textContent = String(displayHour).padStart(2, '0') + ':' + String(displayMinute).padStart(2, '0') + ':' + String(date.getSeconds()).padStart(2, '0') + ' · ' + (paused ? 'PAUSED' : live ? 'LIVE' : speed + '× SIMULATION');
      lastStatus = tick;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
